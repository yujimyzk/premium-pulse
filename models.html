<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>スニーカー型番探索｜PREMIUM PULSE</title><meta name="description" content="Yahoo!ショッピングから抽出したスニーカー型番候補を検索。未確認データを明示して掲載しています。">
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#ebf6ff;background:#091321}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}a{color:#70e5d2}.logo{font-weight:900;letter-spacing:.08em}h1{font-size:clamp(30px,6vw,50px);margin:26px 0 10px}.subtitle{color:#b6c9dd;line-height:1.7}.notice{background:#1c3545;border:1px solid #436979;padding:16px;border-radius:12px;line-height:1.7;margin:22px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,select{background:#15283a;color:#fff;border:1px solid #4b667f;border-radius:9px;padding:13px;font-size:16px;min-height:48px}input{flex:3;min-width:220px}select{flex:1;min-width:170px}.summary{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px;color:#bdd4e5}.summary strong{font-size:25px;color:#76ead5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:13px}.photo{height:180px;margin:-18px -18px 16px;background:#23374a;display:flex;align-items:center;justify-content:center;color:#b3c6d6;overflow:hidden}.photo img{height:100%;width:100%;object-fit:contain;background:#f5f5f5}.card{background:#142638;border:1px solid #304b62;border-radius:14px;padding:18px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.sku{font-weight:850;font-size:22px;overflow-wrap:anywhere}.badge{font-size:12px;border-radius:99px;background:#32424d;color:#e7e6ce;padding:5px 9px;white-space:nowrap}.name{line-height:1.6;min-height:65px;color:#d7e6f5;overflow-wrap:anywhere}.meta{font-size:13px;color:#a9bfd1}.view{display:inline-block;margin-top:12px}.empty{padding:30px;border:1px dashed #4b667f;border-radius:12px;text-align:center}footer{margin:35px 0;color:#a9bfd1;font-size:13px}
</style></head><body><main><header><div class="logo">PREMIUM PULSE</div><a href="./">トップページへ戻る</a></header>
<h1>スニーカー型番探索</h1><p class="subtitle">毎日の自動収集で見つかった型番候補を検索できます。スニーカー情報を発見・調査するためのページです。</p>
<div class="notice"><b>掲載データはすべて未確認の候補です。</b> 商品名から型番らしい文字列を抽出した段階で、ブランド・モデルの一致、真贋、サイズ、プレミア性は未検証です。「一致した出品候補数」は市場の取引数や販売実績ではありません。</div>
<div class="toolbar"><input id="q" aria-label="型番・商品名を検索" placeholder="型番・商品名で検索（例: Travis Scott）"><select id="sort" aria-label="表示順"><option value="found">検出件数が多い順</option><option value="sku">型番順</option></select></div>
<div class="summary"><span>候補 <strong id="count">—</strong> 件</span><span id="update">読み込み中…</span></div><div class="grid" id="list" aria-live="polite"></div>
<footer>データ取得元：Yahoo!ショッピング 商品検索API。外部出品ページに移動した際の価格・内容は予告なく変更される場合があります。<p><a href="./status.html">データ収集状況を見る</a></p></footer></main>
<script>
const q=document.getElementById('q'),sort=document.getElementById('sort'),list=document.getElementById('list');
let rows=[];
function card(r){
 const article=document.createElement('article');article.className='card';const pic=document.createElement('div');pic.className='photo';pic.textContent='NO IMAGE';try{const u=new URL(r.sample_image_url);if(u.protocol==='https:'&&((host)=>host==="yimg.jp"||host.endsWith(".yimg.jp"))(u.hostname)){const img=document.createElement('img');img.src=u.href;img.loading='lazy';img.alt=(r.sample_name||'スニーカー')+'の参考商品画像';img.referrerPolicy='no-referrer';img.onerror=()=>{pic.replaceChildren();pic.textContent='NO IMAGE'};pic.replaceChildren(img)}}catch{}article.append(pic);
 const top=document.createElement('div');top.className='top';
 const sku=document.createElement('span');sku.className='sku';sku.textContent=r.sku||'型番不明';
 const badge=document.createElement('span');badge.className='badge';badge.textContent='確認待ち';
 top.append(sku,badge);article.append(top);
 const name=document.createElement('p');name.className='name';name.textContent=r.sample_name||'商品名未登録';article.append(name);
 const meta=document.createElement('div');meta.className='meta';meta.textContent='検索結果内の一致候補：'+Number(r.matching_listings||0)+'件';article.append(meta);
 const detail=document.createElement('a');detail.className='view';detail.href='./product.html?sku='+encodeURIComponent(r.sku);detail.textContent='型番の詳細を見る';article.append(detail);article.append(document.createElement('br'));
 try{const u=new URL(r.sample_url);if(u.protocol==='https:'){const a=document.createElement('a');a.className='view';a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent='出典の商品ページを見る';article.append(a)}}catch{}
 return article
}
function render(){
 const text=q.value.trim().toLowerCase();const data=rows.filter(r=>(String(r.sku||'')+' '+String(r.sample_name||'')).toLowerCase().includes(text));
 data.sort(sort.value==='sku'?(a,b)=>String(a.sku).localeCompare(String(b.sku)):(a,b)=>(Number(b.matching_listings)||0)-(Number(a.matching_listings)||0)||String(a.sku).localeCompare(String(b.sku)));
 document.getElementById('count').textContent=data.length;list.replaceChildren();
 if(!data.length){const e=document.createElement('div');e.className='empty';e.textContent=rows.length?'該当する型番候補がありません。':'まだ型番候補はありません。';list.append(e)}
 else {const frag=document.createDocumentFragment();for(const row of data)frag.append(card(row));list.append(frag)}
}
q.addEventListener('input',render);sort.addEventListener('change',render);
fetch('./data/discovery_queue.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('fetch');return r.json()}).then(d=>{rows=Array.isArray(d.candidates)?d.candidates:[];document.getElementById('update').textContent='最終発見：'+(d.updated_at||'未取得');render()}).catch(()=>{document.getElementById('update').textContent='データを読み込めませんでした';list.textContent='再読み込みしてお試しください。'});
</script></body></html>
