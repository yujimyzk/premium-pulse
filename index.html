<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PREMIUM PULSE｜スニーカー価格ウォッチ</title><meta name="description" content="出典を確認できるスニーカー価格情報を整理。定価と参考出品価格を比較します。"><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#eaf1ff;background:#080e1b}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;padding:24px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:48px}.logo{font-weight:900;letter-spacing:.13em;font-size:20px}.logo span{color:#55e6bd}.eyebrow{color:#55e6bd;font-size:13px;letter-spacing:.15em;font-weight:800}h1{font-size:clamp(32px,6vw,62px);line-height:1.15;margin:12px 0}p{color:#a9b9d2;line-height:1.8}.hero{border:1px solid #283a54;border-radius:24px;padding:clamp(22px,5vw,55px);background:radial-gradient(circle at 90% 15%,#124a56,transparent 40%),linear-gradient(130deg,#142743,#101725);margin-bottom:22px}.notice{background:#193148;color:#e7f5fb;border:1px solid #466577;padding:14px 18px;border-radius:12px;font-size:14px;line-height:1.7}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}.controls>*{min-height:44px;border-radius:10px;border:1px solid #34455f;background:#162137;color:white;padding:10px 14px;font-size:15px}input{flex:2;min-width:200px}select{flex:1;min-width:150px}button{cursor:pointer}button:hover{border-color:#55e6bd}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}.stat,.card{background:#121f34;border:1px solid #293b54;border-radius:16px}.stat{padding:20px}.stat small{display:block;color:#9aacc6}.stat strong{display:block;font-size:25px;margin-top:7px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{overflow:hidden}.art{padding:24px;background:linear-gradient(125deg,#203f59,#143340);display:flex;justify-content:space-between;font-size:45px}.rank{font-size:12px;border:1px solid #5fb6af;border-radius:30px;color:#bff9e8;padding:6px 12px;height:max-content}.content{padding:20px}.brand{color:#55e6bd;font-size:12px;font-weight:800;text-transform:uppercase}h3{font-size:21px;margin:7px 0}.sku,.meta{font-size:13px;color:#9eb1cc;line-height:1.8}.prices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}.prices small{display:block;font-size:11px;color:#92a8c3}.prices strong{font-size:18px}.tags{display:flex;gap:8px;flex-wrap:wrap}.tag{border-radius:6px;padding:5px 8px;background:#243c54;color:#eaf1ff;font-size:13px}.tag.up{color:#7af0c9}.meta{border-top:1px solid #304059;margin-top:16px;padding-top:12px;overflow-wrap:anywhere}a{color:#7be6d0}.empty{grid-column:1/-1;text-align:center;padding:50px 20px;border:1px dashed #4a627e;border-radius:14px}footer{margin-top:40px;border-top:1px solid #27394f;padding:22px 0;font-size:13px;color:#96a7c1}@media(max-width:580px){main{padding:15px}.stats{grid-template-columns:repeat(2,1fr)}.stat:last-child{grid-column:span 2}header{margin-bottom:20px}}
</style></head><body><main><header><div class="logo">PREMIUM <span>PULSE</span></div><div style="font-size:12px;color:#a1b5cc">SNEAKER PRICE WATCH</div></header><div style="margin:0 0 18px;display:flex;gap:14px;flex-wrap:wrap"><a href="./watchlist.html">注目スニーカー10選を見る →</a><a href="./research.html">価格の調べ方 →</a></div><section class="hero"><div class="eyebrow">PREMIUM SNEAKER DATA</div><h1>プレミア価格を、<br>根拠とともに。</h1><p>スニーカーの定価と参考出品価格を比較。型番・情報源・観測日を確認できるデータだけを掲載します。</p><button id="mode" aria-label="デモ表示切り替え">デモデータを見る</button></section><div class="notice" id="notice">データ読み込み中...</div><div class="controls"><input id="search" placeholder="商品名・ブランド・型番で検索" aria-label="検索"><select id="brand" aria-label="ブランド"><option value="">全ブランド</option></select><select id="sort" aria-label="並び替え"><option value="premium">プレミア率順</option><option value="change">前回比順</option><option value="price">参考出品価格順</option><option value="name">商品名順</option></select></div><div class="stats"><div class="stat"><small>掲載商品数</small><strong id="total">—</strong></div><div class="stat"><small>平均プレミア率</small><strong id="avg">—</strong></div><div class="stat"><small>最終観測日</small><strong id="date">—</strong></div></div><div id="cards" class="cards"></div><footer>※ 参考出品価格は売買成立価格を意味しません。表示データは価格や利益を保証しません。比較は税込・税抜や商品状態・サイズが一致している場合に限り有効です。非公式・独立運営の情報サイトです。</footer></main><script>
const demo={mode:"demo",updated:"2026-11-13",items:[{name:"限定スニーカー SAMPLE A",brand:"DEMO",sku:"SAMPLE-01",retail:20000,listing:30000,prior:28000,checked:"2026-11-13",source:"",note:"架空のサンプル価格"},{name:"限定スニーカー SAMPLE B",brand:"DEMO",sku:"SAMPLE-02",retail:18000,listing:21000,prior:24000,checked:"2026-11-13",source:"",note:"架空のサンプル価格"}]};
let verified={mode:"verified",updated:null,items:[]},isDemo=false;const el=id=>document.getElementById(id),jpy=n=>"¥"+Number(n||0).toLocaleString("ja-JP"),percent=(a,b)=>Number(b)>0?(Number(a)/Number(b)-1)*100:null,fmt=n=>n===null?"—":(n>0?"+":"")+n.toFixed(1)+"%",escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){const d=isDemo?demo:verified;el("mode").textContent=isDemo?"確認済みデータを見る":"デモデータを見る";el("notice").textContent=isDemo?"【デモ表示】表示される価格・変動率はすべて架空の例です。実際の市場価格ではありません。":"【確認済みデータ】公開根拠と観測日を表示しています。参考出品価格は成約価格ではありません。";el("total").textContent=d.items.length;el("date").textContent=d.updated||"未登録";const scores=d.items.map(x=>percent(x.listing,x.retail)).filter(x=>x!==null);el("avg").textContent=scores.length?fmt(scores.reduce((a,b)=>a+b,0)/scores.length):"—";const brands=[...new Set(d.items.map(x=>x.brand))].sort(),old=el("brand").value;el("brand").innerHTML='<option value="">全ブランド</option>'+brands.map(x=>'<option value="'+escapeHTML(x)+'">'+escapeHTML(x)+'</option>').join("");el("brand").value=brands.includes(old)?old:"";const q=el("search").value.trim().toLowerCase();let list=d.items.filter(x=>(!q||[x.name,x.brand,x.sku].join(" ").toLowerCase().includes(q))&&(!el("brand").value||x.brand===el("brand").value));const key=x=>el("sort").value==="change"?(percent(x.listing,x.prior)??-Infinity):el("sort").value==="price"?Number(x.listing):percent(x.listing,x.retail)??-Infinity;list.sort((a,b)=>el("sort").value==="name"?a.name.localeCompare(b.name):key(b)-key(a));el("cards").innerHTML=list.length?list.map((x,i)=>'<article class="card"><div class="art"><span>👟</span><span class="rank">#'+(i+1)+' '+(isDemo?'DEMO':'VERIFIED')+'</span></div><div class="content"><div class="brand">'+escapeHTML(x.brand)+'</div><h3>'+escapeHTML(x.name)+'</h3><div class="sku">型番：'+escapeHTML(x.sku)+'</div><div class="prices"><div><small>参考定価</small><strong>'+jpy(x.retail)+'</strong></div><div><small>参考出品価格</small><strong>'+jpy(x.listing)+'</strong></div></div><div class="tags"><span class="tag up">プレミア '+fmt(percent(x.listing,x.retail))+'</span><span class="tag">前回比 '+fmt(percent(x.listing,x.prior))+'</span></div><div class="meta">観測日：'+escapeHTML(x.checked)+'<br>'+(x.source?'<a href="'+escapeHTML(x.source)+'" target="_blank" rel="noopener noreferrer">出典を見る ↗</a>':'出典なし・デモ')+(x.note?'<br>'+escapeHTML(x.note):'')+'</div></div></article>').join(""):'<div class="empty"><strong>確認済みの相場データはまだ登録されていません。</strong><p>架空の価格を本物として掲載しないため、実際の出典と観測日が揃うまで空欄にしています。上の「デモデータを見る」で操作を試せます。</p></div>'}
["search","brand","sort"].forEach(id=>el(id).addEventListener(id==="search"?"input":"change",render));el("mode").addEventListener("click",()=>{isDemo=!isDemo;el("search").value="";render()});fetch("./data/latest.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(v=>{if(v?.mode==="verified"&&Array.isArray(v.items))verified=v;render()}).catch(render);render();
</script></body></html>
