<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>出品価格ウォッチ｜PREMIUM PULSE</title><meta name="description" content="Yahoo!ショッピングで観測されたスニーカーの未検証出品価格を型番・状態別に検索。"><style>
*{box-sizing:border-box}body{margin:0;background:#091321;color:#eef5ff;font:15px/1.7 system-ui,-apple-system,sans-serif}main{max-width:1100px;margin:auto;padding:20px}a{color:#72e8d2}.brand{font-weight:900;letter-spacing:.08em}h1{font-size:clamp(29px,5vw,48px);margin:30px 0 6px}.desc{color:#abc1d4}.warn{background:#1c3647;border:1px solid #4a6a7a;border-radius:13px;padding:17px;margin:20px 0}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#14293d;padding:13px 18px;border-radius:11px;border:1px solid #2e4a60}.stat strong{font-size:25px;display:block}.stat small{color:#b3c7d9}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}input,select{border:1px solid #46657b;background:#142539;color:white;border-radius:9px;padding:13px;font-size:15px;min-height:46px}input{min-width:220px;flex:3}select{min-width:130px;flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.item{background:#132639;border:1px solid #304b60;padding:17px;border-radius:15px;overflow-wrap:anywhere}.photo{height:210px;margin:-17px -17px 14px;background:#21364a;display:flex;align-items:center;justify-content:center;color:#b6c9dc;overflow:hidden}.photo img{display:block;width:100%;height:100%;object-fit:contain;background:#f5f5f5}.item h2{font-size:17px;line-height:1.5;margin:10px 0}.item .sku{color:#7be5d0;font-weight:700}.item .price{font-weight:850;font-size:27px}.item .muted{color:#b5c7d7;font-size:13px}.badge{display:inline-block;padding:3px 9px;border-radius:30px;background:#35434d;font-size:12px}.button{display:inline-block;margin-top:10px}.empty{padding:24px;background:#132639;border:1px dashed #57728a;border-radius:12px}footer{color:#abc1d4;margin:35px 0}header{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}</style></head><body><main>
<header><div class="brand">PREMIUM PULSE</div><a href="./">トップへ戻る</a></header>
<h1>出品価格ウォッチ</h1><p class="desc">国内ショップの掲載価格を、型番・新品／中古ごとに探せます。確認できる情報が増えるたびに自動更新されます。</p>
<div class="warn"><b>重要：掲載価格は未検証の販売希望価格です。</b> 実際の成約価格・買取相場・利益ではありません。サイズや付属品、商品の同一性、真贋、送料や税区分を確認していないため、購入判断には出典ページでの確認が必要です。表示件数は検索APIの候補件数です。</div>
<div class="stats"><div class="stat"><small>表示候補</small><strong id="total">—</strong></div><div class="stat"><small>追跡型番</small><strong id="skus">—</strong></div><div class="stat"><small>最終収集</small><strong id="updated" style="font-size:14px">—</strong></div></div>
<div class="tools"><input id="search" placeholder="型番・商品名・ショップ名で検索" aria-label="候補を検索"><select id="condition" aria-label="状態"><option value="">新品・中古すべて</option><option value="new">新品（API表示）</option><option value="used">中古（API表示）</option></select><select id="size" aria-label="商品名に記載されたサイズ"><option value="">すべてのサイズ</option><option value="unknown">サイズ表記なし</option></select><select id="sort" aria-label="並び順"><option value="sku">型番順</option><option value="asc">掲載価格が低い順</option><option value="desc">掲載価格が高い順</option></select></div>
<div id="list" class="grid" aria-live="polite"></div>
<footer><a href="./models.html">新発見の型番候補も見る</a> ／ <a href="./status.html">収集状況</a></footer>
</main><script>
const el=id=>document.getElementById(id),yen=n=>'¥'+Number(n).toLocaleString('ja-JP');let all=[];
const sizeOf=x=>{if(typeof x.size_cm_hint==='number'&&x.size_cm_hint>=20&&x.size_cm_hint<=30)return x.size_cm_hint;const m=String(x.name||'').match(/(?<![\d.])((?:2[0-9]|30)(?:\.[05])?)\s*(?:cm|センチ)(?![a-z])/i);return m?Number(m[1]):null};
const state=x=>x==='new'?'新品（API表示）':x==='used'?'中古（API表示）':'状態未確認';
function card(r){const e=document.createElement('article');e.className='item';const pic=document.createElement('div');pic.className='photo';pic.textContent='NO IMAGE';try{const u=new URL(r.image_url);if(u.protocol==='https:'&&(/(^|\\.)yimg\\.jp$/.test(u.hostname))){const img=document.createElement('img');img.src=u.href;img.alt=(r.name||'スニーカー')+'の商品掲載画像';img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=()=>{pic.replaceChildren();pic.textContent='NO IMAGE'};pic.replaceChildren(img)}}catch{}e.append(pic);const sku=document.createElement('div');sku.className='sku';sku.textContent=r.watch_sku||'型番不明';e.append(sku);const title=document.createElement('h2');title.textContent=r.name||'商品名なし';e.append(title);const price=document.createElement('div');price.className='price';price.textContent=yen(r.price_jpy);e.append(price);const badge=document.createElement('div');badge.className='badge';badge.textContent='未確認・'+state(r.condition_hint);e.append(badge);const sz=sizeOf(r);const sizeLabel=document.createElement('div');sizeLabel.className='muted';sizeLabel.textContent='商品名のサイズ表記：'+(sz==null?'不明':sz+'cm')+'（未検証）';e.append(sizeLabel);const meta=document.createElement('div');meta.className='muted';meta.textContent='出品者：'+(r.seller||'不明')+' ／ 観測：'+(r.observed_at||'不明');e.append(meta);const detail=document.createElement('a');detail.className='button';detail.href='./product.html?sku='+encodeURIComponent(r.watch_sku);detail.textContent='型番の写真・価格履歴を見る';e.append(detail);e.append(document.createElement('br'));try{const u=new URL(r.url);if(u.protocol==='https:'){const a=document.createElement('a');a.className='button';a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent='元の出品ページを見る';e.append(a)}}catch{}return e}
function render(){const q=el('search').value.trim().toLowerCase(),condition=el('condition').value,sort=el('sort').value,size=el('size').value;const rows=all.filter(x=>(!q||[x.watch_sku,x.name,x.seller].join(' ').toLowerCase().includes(q))&&(!condition||x.condition_hint===condition)&&(!size||(size==='unknown'?sizeOf(x)==null:String(sizeOf(x))===size)));rows.sort((a,b)=>sort==='asc'?a.price_jpy-b.price_jpy:sort==='desc'?b.price_jpy-a.price_jpy:String(a.watch_sku).localeCompare(String(b.watch_sku))||a.price_jpy-b.price_jpy);el('total').textContent=rows.length;el('list').replaceChildren();if(!rows.length){const e=document.createElement('div');e.className='empty';e.textContent=all.length?'一致する商品はありません。':'現在掲載できる出品候補はありません。';el('list').append(e)}else{const frag=document.createDocumentFragment();rows.forEach(x=>frag.append(card(x)));el('list').append(frag)}}
['search','condition','size','sort'].forEach(id=>el(id).addEventListener(id==='search'?'input':'change',render));
fetch('./data/review_candidates.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Failed');return r.json()}).then(d=>{all=(Array.isArray(d.candidates)?d.candidates:[]).filter(x=>x.verification==='pending'&&Number.isSafeInteger(x.price_jpy)&&x.price_jpy>0&&typeof x.watch_sku==='string');el('updated').textContent=d.generated_at||'未取得';el('skus').textContent=new Set(all.map(x=>x.watch_sku)).size;const sizes=[...new Set(all.map(sizeOf).filter(x=>x!=null))].sort((a,b)=>a-b);for(const n of sizes){const option=document.createElement('option');option.value=String(n);option.textContent=n+'cm（商品名）';el('size').append(option)}render()}).catch(()=>{el('list').textContent='データを読み込めませんでした。ページを再読み込みしてください。';el('updated').textContent='読み込み失敗'});
</script></body></html>
