name: Weekly verified price refresh
on:
  schedule:
    - cron: '17 0 * * 1' # Monday 09:17 JST
  workflow_dispatch:
  push:
    paths:
      - 'data/verified.csv'
      - 'update.py'
jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and rebuild
        run: python update.py
      - name: Commit changed feed
        run: |
          if ! git diff --quiet -- data/latest.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/latest.json
            git commit -m "Refresh verified sneaker feed"
            git push
          fi
