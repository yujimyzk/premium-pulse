name: Weekly Yahoo Shopping candidate collection
on:
  workflow_dispatch:
  schedule:
    - cron: '35 0 * * 1'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect candidates
        env:
          YAHOO_SHOPPING_APP_ID: ${{ secrets.YAHOO_SHOPPING_APP_ID }}
        run: python collect_yahoo.py
      - name: Save review candidates
        run: |
          if ! git diff --quiet -- data/review_candidates.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/review_candidates.json
            git commit -m "Collect review-only listing candidates"
            git push
          fi
